<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeatAir Book — HVAC Service & Maintenance-Agreement Tracker</title>
<style>
:root{
  --bg:#f4f1ec; --card:#ffffff; --ink:#22252a; --muted:#6b7280; --line:#e3ded4;
  --brand:#b3402a; --brand2:#1f5fa8; --ok:#1e7d32; --warn:#b8860b; --bad:#b3261e;
  --chip:#f0ebe2; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:linear-gradient(90deg,var(--brand),#7a2a1a);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header .sub{font-size:12.5px;opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;background:#2b2e35;padding:8px 10px;position:sticky;top:64px;z-index:19}
nav button{flex:0 0 auto;border:0;background:#3a3e47;color:#dfe3ea;padding:8px 13px;border-radius:999px;font-size:13.5px;cursor:pointer;min-height:38px}
nav button.active{background:#fff;color:#22252a;font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.card h3{margin:12px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c9c4b8;border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1 1 150px}
.btn{display:inline-block;border:0;border-radius:9px;padding:10px 16px;font-size:14.5px;cursor:pointer;min-height:42px;background:var(--brand2);color:#fff}
.btn.primary{background:var(--brand)}
.btn.ghost{background:#e8e3d8;color:var(--ink)}
.btn.small{padding:6px 11px;min-height:34px;font-size:13px;min-height:40px;}
.btn.danger{background:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:#e0f2e3;color:var(--ok)}
.pill.warn{background:#fdf3d7;color:#8a6508}
.pill.bad{background:#fbe3e1;color:var(--bad)}
.pill.grey{background:#eceae4;color:#555}
.pill.blue{background:#e1ecfa;color:var(--brand2)}
.mut{color:var(--muted);font-size:13px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.checkitem{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.checkitem input{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.checkitem .note{flex:1}
.checkitem .note input{padding:5px 8px;font-size:13.5px}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1}
details.card summary{cursor:pointer;font-weight:600;font-size:15px}
.kv{font-size:14px}.kv b{display:inline-block;min-width:130px;color:var(--muted);font-weight:500}
.empty{padding:18px;text-align:center;color:var(--muted)}
.flash{background:#e0f2e3;border:1px solid #bfe3c6;color:#14541d;padding:9px 12px;border-radius:9px;margin-bottom:12px;font-size:14px}
@media (max-width:560px){ header h1{font-size:18px} nav{top:60px} th,td{padding:6px 4px;font-size:13px} }
@media print{
  header,nav,.btn,.btnrow,.searchbar,.noprint{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{border:0;border-bottom:1px solid #ccc;border-radius:0;page-break-inside:avoid}
  .printonly{display:block!important}
}
.printonly{display:none}
.sig{margin-top:26px;display:flex;gap:30px}
.sig div{flex:1;border-top:1px solid #444;padding-top:4px;font-size:12px;color:#444}
</style>
</head>
<body>
<header>
  <h1>🔥❄️ HeatAir Book</h1>
  <div class="sub" id="hdrCompany">HVAC Service &amp; Maintenance-Agreement Tracker</div>
</header>
<nav id="tabs">
  <button data-tab="dash" class="active">Dashboard</button>
  <button data-tab="cust">Customers &amp; Systems</button>
  <button data-tab="agree">Agreements</button>
  <button data-tab="calls">Service Calls</button>
  <button data-tab="tune">Tune-Ups</button>
  <button data-tab="set">Settings &amp; Backup</button>
  <button data-tab="help">Help</button>
</nav>
<main id="app"></main>

<script>
"use strict";
/* ============================ HeatAir Book ============================
   Single-file offline HVAC book: customers & systems, maintenance
   agreements, service calls, tune-up checklists, money summary.
   Data lives in localStorage only. No account, no server.          */

var LS_KEY = "heatairbook_v1";

/* ---------- tune-up checklists ---------- */
var FALL_ITEMS = [
  "Replace / inspect air filter",
  "Test thermostat operation & calibration",
  "Inspect burners & clean as needed",
  "Inspect heat exchanger for cracks / corrosion",
  "Test ignition system & flame sensor",
  "Check flue pipe & venting for blockage / leaks",
  "Carbon monoxide test at registers",
  "Inspect blower motor, wheel & belt",
  "Lubricate motors / bearings (where applicable)",
  "Check gas pressure & manifold setting",
  "Test all safety controls & limit switches",
  "Inspect ductwork connections & visible runs"
];
var SPRING_ITEMS = [
  "Replace / inspect air filter",
  "Clean condenser coil & clear debris",
  "Check refrigerant charge (superheat / subcool)",
  "Inspect evaporator coil & drain pan",
  "Flush condensate drain line",
  "Inspect & tighten electrical connections",
  "Test capacitors & contactor",
  "Check condenser fan motor & blade",
  "Test thermostat operation & calibration",
  "Inspect ductwork connections & visible runs",
  "Check condensate pump (if fitted)",
  "Record temperature split across coil"
];

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function money(n){ n = num(n); var neg = n < 0; n = Math.abs(n); return (neg?"-$":"$") + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function uid(p){ return (p||"id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function validISODate(s){
  if(typeof s!=="string") return false;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return false;
  var y=+m[1], mo=+m[2], d=+m[3]; if(mo<1||mo>12||d<1||d>31) return false;
  var dt = new Date(Date.UTC(y,mo-1,d));
  return dt.getUTCFullYear()===y && dt.getUTCMonth()===mo-1 && dt.getUTCDate()===d;
}
function addDays(iso, days){ var t = Date.parse(iso+"T12:00:00"); if(!isFinite(t)) return iso; var d = new Date(t + days*86400000); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a, b){ var ta = Date.parse(a+"T12:00:00"), tb = Date.parse(b+"T12:00:00"); if(!isFinite(ta)||!isFinite(tb)) return null; return Math.round((tb-ta)/86400000); }
function fmtDate(iso){ if(!validISODate(iso)) return iso||"—"; var p = iso.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }
function clampNonNeg(n){ n = num(n); return n < 0 ? 0 : n; }
function monthKey(iso){ return validISODate(iso) ? iso.slice(0,7) : ""; }

/* ---------- pure business math (also used by QA harness) ---------- */
function callBilled(call){ return Math.round((clampNonNeg(call.laborHours)*clampNonNeg(call.laborRate) + clampNonNeg(call.partsCost))*100)/100; }
function callBalance(call){ return Math.round((callBilled(call) - clampNonNeg(call.collected))*100)/100; }
function visitsPerYear(a){ var v = Math.round(num(a.visitsPerYear)); return v > 0 ? v : 2; }
function visitsUsed(a){ return Math.max(0, Math.round(num(a.visitsUsed))); }
function visitsLeft(a){ return Math.max(0, visitsPerYear(a) - visitsUsed(a)); }
function renewalState(a, today){
  if(a.status !== "active") return a.status; /* expired / cancelled pass through */
  if(!validISODate(a.renewalDate)) return "active";
  var d = daysBetween(today, a.renewalDate);
  if(d === null) return "active";
  if(d < 0) return "overdue";
  if(d <= 30) return "due-soon";
  return "active";
}
function moneySummary(state, year){
  var s = { agreeRev:0, serviceBilled:0, serviceCollected:0, outstanding:0, months:{}, callCount:0, agreeCount:0 };
  state.agreements.forEach(function(a){
    if(a.status !== "cancelled" && validISODate(a.startDate) && a.startDate.slice(0,4) === String(year)){
      s.agreeRev += clampNonNeg(a.price); s.agreeCount++;
    }
  });
  state.calls.forEach(function(c){
    if(!validISODate(c.date) || c.date.slice(0,4) !== String(year)) return;
    var b = callBilled(c), col = clampNonNeg(c.collected);
    s.serviceBilled += b; s.serviceCollected += col; s.callCount++;
    var mk = monthKey(c.date);
    if(!s.months[mk]) s.months[mk] = { billed:0, collected:0 };
    s.months[mk].billed += b; s.months[mk].collected += col;
  });
  state.calls.forEach(function(c){ var bal = callBalance(c); if(bal > 0) s.outstanding += bal; });
  s.agreeRev = Math.round(s.agreeRev*100)/100;
  s.serviceBilled = Math.round(s.serviceBilled*100)/100;
  s.serviceCollected = Math.round(s.serviceCollected*100)/100;
  s.outstanding = Math.round(s.outstanding*100)/100;
  return s;
}

/* ---------- seed / sample data ---------- */
function seedData(){
  var yr = new Date().getFullYear();
  var custs = [
    { id:"c_henderson", demo:true, name:"Mark & Lisa Henderson", address:"1214 Ridgeview Dr", phone:"555-0142", email:"hendersons@example.com",
      systemType:"Furnace + AC", brand:"Carrier", yearInstalled:2016, tonnage:3, filterSize:"16x25x1", warrantyParts: yr+1+"-06-30", warrantyInstall:"" },
    { id:"c_okafor", demo:true, name:"Adaeze Okafor", address:"88 Willow Bend Ln", phone:"555-0117", email:"",
      systemType:"Heat Pump", brand:"Trane", yearInstalled:2021, tonnage:2.5, filterSize:"20x20x1", warrantyParts: yr+6+"-03-15", warrantyInstall: yr+1+"-03-15" },
    { id:"c_deluca", demo:true, name:"Frank DeLuca", address:"402 Orchard St", phone:"555-0199", email:"fdeluca@example.com",
      systemType:"Furnace + AC", brand:"Lennox", yearInstalled:2009, tonnage:4, filterSize:"16x20x1", warrantyParts:"", warrantyInstall:"" },
    { id:"c_pruitt", demo:true, name:"Sandra Pruitt", address:"27 County Line Rd", phone:"555-0163", email:"",
      systemType:"Furnace Only", brand:"Goodman", yearInstalled:2019, tonnage:0, filterSize:"14x25x1", warrantyParts: yr+4+"-09-01", warrantyInstall:"" },
    { id:"c_vance", demo:true, name:"Tom & Ray Vance", address:"1905 Elm Terrace", phone:"555-0128", email:"vancebros@example.com",
      systemType:"AC Only", brand:"Rheem", yearInstalled:2013, tonnage:3.5, filterSize:"20x25x1", warrantyParts:"", warrantyInstall:"" }
  ];
  var agrees = [
    { id:"a_henderson", demo:true, customerId:"c_henderson", tier:"Premium", price:249, startDate: yr+"-01-15", renewalDate:(yr+1)+"-01-15", visitsPerYear:2, visitsUsed:1, status:"active" },
    { id:"a_okafor", demo:true, customerId:"c_okafor", tier:"Basic", price:179, startDate: addDays(todayISO(),-335), renewalDate: addDays(todayISO(),18), visitsPerYear:2, visitsUsed:2, status:"active" },
    { id:"a_deluca", demo:true, customerId:"c_deluca", tier:"Premium Plus", price:329, startDate: addDays(todayISO(),-400), renewalDate: addDays(todayISO(),-35), visitsPerYear:2, visitsUsed:1, status:"active" },
    { id:"a_pruitt", demo:true, customerId:"c_pruitt", tier:"Basic", price:179, startDate: yr+"-03-01", renewalDate:(yr+1)+"-03-01", visitsPerYear:2, visitsUsed:0, status:"active" },
    { id:"a_vance_old", demo:true, customerId:"c_vance", tier:"Basic", price:169, startDate:(yr-1)+"-05-01", renewalDate: yr+"-05-01", visitsPerYear:2, visitsUsed:2, status:"expired" }
  ];
  var calls = [
    { id:"s_henderson1", demo:true, customerId:"c_henderson", date: yr+"-02-10", complaint:"Furnace short-cycling", diagnosis:"Dirty flame sensor; cleaned and tested", partsUsed:"None", laborHours:1.0, laborRate:95, partsCost:0, collected:95 },
    { id:"s_deluca1", demo:true, customerId:"c_deluca", date: yr+"-06-18", complaint:"No cooling", diagnosis:"Failed dual-run capacitor; replaced", partsUsed:"45/5 dual-run capacitor", laborHours:1.5, laborRate:95, partsCost:42.50, collected:185 },
    { id:"s_deluca2", demo:true, customerId:"c_deluca", date: yr+"-07-02", complaint:"Weak airflow upstairs", diagnosis:"Collapsed flex duct in attic; replaced 12 ft run", partsUsed:"12 ft insulated flex duct, straps", laborHours:2.5, laborRate:95, partsCost:86.25, collected:200 },
    { id:"s_pruitt1", demo:true, customerId:"c_pruitt", date: yr+"-10-05", complaint:"Furnace won't ignite", diagnosis:"Cracked hot-surface igniter; replaced", partsUsed:"Hot-surface igniter", laborHours:1.0, laborRate:95, partsCost:58, collected:0 }
  ];
  var fallChecks = FALL_ITEMS.map(function(t,i){ return { item:t, done: i !== 3, note: i===0 ? "Replaced filter" : "" }; });
  var tunes = [
    { id:"t_henderson_fall", demo:true, customerId:"c_henderson", agreementId:"a_henderson", season:"Fall (Furnace)", date: yr+"-10-12", tech:"J. Martinez", items: fallChecks, summary:"System heating well. Heat exchanger visual inspection clear. Recommended monitoring inducer motor noise next visit." }
  ];
  return {
    settings: { company:"HeatAir Pros LLC", phone:"555-0100", email:"office@heatairpros.example", defaultLaborRate:95,
      tierBasic:179, tierPremium:249, tierPremiumPlus:329 },
    customers: custs, agreements: agrees, calls: calls, tuneups: tunes
  };
}

/* ---------- state ---------- */
var state = null;
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var parsed = JSON.parse(raw); if(parsed && Array.isArray(parsed.customers)){ state = sanitizeState(parsed); return; } }
  }catch(e){}
  state = seedData(); save();
}
function sanitizeState(s){
  function str(v){ return typeof v==="string" ? v : (v==null ? "" : String(v)); }
  function arr(v){ return Array.isArray(v) ? v : []; }
  var out = { settings:{ company:"", phone:"", email:"", defaultLaborRate:95, tierBasic:179, tierPremium:249, tierPremiumPlus:329 },
    customers:[], agreements:[], calls:[], tuneups:[] };
  if(s.settings){ ["company","phone","email"].forEach(function(k){ out.settings[k]=str(s.settings[k]); });
    ["defaultLaborRate","tierBasic","tierPremium","tierPremiumPlus"].forEach(function(k){ if(s.settings[k]!=null) out.settings[k]=clampNonNeg(s.settings[k]); }); }
  arr(s.customers).forEach(function(c){ if(!c || !c.id) return;
    out.customers.push({ id:str(c.id), demo:!!c.demo, name:str(c.name), address:str(c.address), phone:str(c.phone), email:str(c.email),
      systemType:str(c.systemType), brand:str(c.brand), yearInstalled: Math.round(num(c.yearInstalled)), tonnage: clampNonNeg(c.tonnage),
      filterSize:str(c.filterSize), warrantyParts: validISODate(c.warrantyParts)?c.warrantyParts:"", warrantyInstall: validISODate(c.warrantyInstall)?c.warrantyInstall:"" }); });
  var custIds = {}; out.customers.forEach(function(c){ custIds[c.id]=true; });
  arr(s.agreements).forEach(function(a){ if(!a || !a.id || !custIds[a.customerId]) return;
    out.agreements.push({ id:str(a.id), demo:!!a.demo, customerId:a.customerId, tier:str(a.tier)||"Basic",
      price:clampNonNeg(a.price), startDate: validISODate(a.startDate)?a.startDate:"", renewalDate: validISODate(a.renewalDate)?a.renewalDate:"",
      visitsPerYear: Math.max(1, Math.round(num(a.visitsPerYear))||2), visitsUsed: Math.max(0, Math.round(num(a.visitsUsed))),
      status: ["active","expired","cancelled"].indexOf(a.status)>=0 ? a.status : "active" }); });
  arr(s.calls).forEach(function(c){ if(!c || !c.id || !custIds[c.customerId] || !validISODate(c.date)) return;
    out.calls.push({ id:str(c.id), demo:!!c.demo, customerId:c.customerId, date:c.date, complaint:str(c.complaint), diagnosis:str(c.diagnosis),
      partsUsed:str(c.partsUsed), laborHours:clampNonNeg(c.laborHours), laborRate:clampNonNeg(c.laborRate), partsCost:clampNonNeg(c.partsCost), collected:clampNonNeg(c.collected) }); });
  arr(s.tuneups).forEach(function(t){ if(!t || !t.id || !custIds[t.customerId] || !validISODate(t.date)) return;
    var items = arr(t.items).filter(function(it){ return it && typeof it.item==="string"; }).map(function(it){ return { item:it.item, done:!!it.done, note:str(it.note) }; });
    out.tuneups.push({ id:str(t.id), demo:!!t.demo, customerId:t.customerId, agreementId:str(t.agreementId), season: t.season==="Spring (AC)" ? "Spring (AC)" : "Fall (Furnace)",
      date:t.date, tech:str(t.tech), items:items, summary:str(t.summary) }); });
  out.legal = sanitizeLegal(s.legal);
  return out;
}

/* ---------- lookups ---------- */
function custById(id){ for(var i=0;i<state.customers.length;i++) if(state.customers[i].id===id) return state.customers[i]; return null; }
function custName(id){ var c = custById(id); return c ? c.name : "(deleted customer)"; }
function tierPrice(tier){ if(tier==="Premium") return num(state.settings.tierPremium); if(tier==="Premium Plus") return num(state.settings.tierPremiumPlus); return num(state.settings.tierBasic); }

/* ---------- UI state ---------- */
var ui = { tab:"dash", search:"", editCustomer:null, editAgreement:null, editCall:null, editTune:null, year: new Date().getFullYear() };
var flashMsg = "";
function flash(m){ flashMsg = m; render(); window.scrollTo(0,0); }

var app = document.getElementById("app");
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]"); if(!b) return;
  ui.tab = b.getAttribute("data-tab");
  document.querySelectorAll("#tabs button").forEach(function(x){ x.classList.toggle("active", x===b); });
  render();
});
function setTab(t){ ui.tab = t; document.querySelectorAll("#tabs button").forEach(function(x){ x.classList.toggle("active", x.getAttribute("data-tab")===t); }); render(); }

/* ---------- render ---------- */
function render(){
  document.getElementById("hdrCompany").textContent = (state.settings.company ? state.settings.company + " — " : "") + "HVAC Service & Maintenance-Agreement Tracker";
  var html = "";
  if(flashMsg){ html += '<div class="flash">'+esc(flashMsg)+'</div>'; flashMsg=""; }
  if(ui.tab==="dash") html += viewDash();
  else if(ui.tab==="cust") html += viewCustomers();
  else if(ui.tab==="agree") html += viewAgreements();
  else if(ui.tab==="calls") html += viewCalls();
  else if(ui.tab==="tune") html += viewTuneups();
  else if(ui.tab==="set") html += viewSettings();
  else if(ui.tab==="help") html += viewHelp();
  app.innerHTML = html;
  bindView();
}
function pillForRenewal(a){
  var st = renewalState(a, todayISO());
  if(st==="due-soon") return '<span class="pill warn">RENEWS ≤30 DAYS</span>';
  if(st==="overdue") return '<span class="pill bad">RENEWAL OVERDUE</span>';
  if(st==="active") return '<span class="pill ok">Active</span>';
  if(st==="expired") return '<span class="pill grey">Expired</span>';
  return '<span class="pill grey">Cancelled</span>';
}
function viewDash(){
  var yr = ui.year, s = moneySummary(state, yr);
  var dueSoon = state.agreements.filter(function(a){ var st = renewalState(a, todayISO()); return st==="due-soon" || st==="overdue"; });
  var visitsOwed = 0; state.agreements.forEach(function(a){ if(a.status==="active") visitsOwed += visitsLeft(a); });
  var unpaid = state.calls.filter(function(c){ return callBalance(c) > 0; });
  var h = '<div class="card"><h2>Dashboard — '+yr+'</h2><div class="grid">';
  h += '<div class="stat"><div class="n">'+money(s.agreeRev)+'</div><div class="l">Agreement revenue ('+yr+' starts)</div></div>';
  h += '<div class="stat"><div class="n">'+money(s.serviceBilled)+'</div><div class="l">Service billed ('+yr+')</div></div>';
  h += '<div class="stat"><div class="n">'+money(s.serviceCollected)+'</div><div class="l">Service collected ('+yr+')</div></div>';
  h += '<div class="stat"><div class="n">'+money(s.outstanding)+'</div><div class="l">Outstanding balances (all time)</div></div>';
  h += '<div class="stat"><div class="n">'+visitsOwed+'</div><div class="l">Agreement visits still owed</div></div>';
  h += '<div class="stat"><div class="n">'+state.customers.length+'</div><div class="l">Customers on file</div></div>';
  h += '</div><div class="row" style="margin-top:10px"><div><label>Money year</label><input inputmode="decimal" type="number" id="dashYear" value="'+yr+'"></div><div style="align-self:end"><button class="btn ghost" id="dashYearBtn">Show year</button></div></div></div>';

  h += '<div class="card"><h2>Renewals needing attention</h2>';
  if(!dueSoon.length) h += '<div class="empty">No renewals due in the next 30 days. 🎉</div>';
  else { h += '<table><tr><th>Customer</th><th>Tier</th><th>Renews</th><th>Status</th></tr>';
    dueSoon.forEach(function(a){ h += '<tr><td>'+esc(custName(a.customerId))+'</td><td>'+esc(a.tier)+'</td><td>'+fmtDate(a.renewalDate)+'</td><td>'+pillForRenewal(a)+'</td></tr>'; });
    h += '</table>'; }
  h += '</div>';

  });

    reader.scrollTop = 0;
  }
  ov.querySelector("#legalReadTerms").addEventListener("click", function(){ toggleReader("terms"); });
  var db = ov.querySelector("#legalReadDisc");
  if(db) db.addEventListener("click", function(){ toggleReader("disc"); });
  var legalChk = ov.querySelector("#legalCheck");
  var legalAgreeBtn = ov.querySelector("#legalAgree");
  legalChk.addEventListener("change", function(){ legalAgreeBtn.disabled = !legalChk.checked; legalAgreeBtn.style.opacity = legalChk.checked ? "1" : ".55"; });
  legalAgreeBtn.addEventListener("click", function(){
    if(!legalChk.checked) return;
    try{ state.legal = { termsVersion: TERMS_VERSION, acceptedDate: new Date().toISOString(), disclaimerShown: LEGAL_HAS_DISCLAIMER }; save(); }catch(e){}
    if(ov.parentNode) ov.parentNode.removeChild(ov);
    legalRefreshSection();
  });
}
function legalInit(){
  legalFillSection();
  var rec = legalRecord();
  if(rec && legalVersionCmp(rec.termsVersion, TERMS_VERSION) >= 0) return;
  legalShowOverlay(!!rec);
}
if(typeof MutationObserver !== "undefined"){
  var legalObs = new MutationObserver(function(){ legalFillSection(); });
  legalObs.observe(document.documentElement, { childList: true, subtree: true });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ setTimeout(legalInit, 30); });
else setTimeout(legalInit, 30);

</script>
</body>
</html>
